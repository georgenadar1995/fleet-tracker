<!DOCTYPE html>
<html>
<head>
  <title>Office Fleet Tracking Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; }
    #map { height: 100vh; width: 100%; }
    #panel { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white; padding: 10px 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-family: Arial; }
    .leaflet-tooltip { background: white; border: 1px solid #ccc; font-weight: bold; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>

<div id="panel">
  <h3>Fleet Monitor</h3>
  <p>Status: <span style="color: green; font-weight: bold;">Active</span></p>
</div>

<div id="map"></div>

<script>
  // Center wider over Mumbai/Thane to catch lng 73 changes
  const map = L.map('map').setView([19.0760, 72.9500], 11);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
  }).addTo(map);

  const markers = {};
  
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhNxmzISCt7F8_lgoknKDZQOxr0ZDig8D6kfPk7cfowjW4umjFBqbfdxYsNCyUCOP9cw/exec";

  async function fetchFleetData() {
    try {
      const response = await fetch(APPS_SCRIPT_URL);
      const data = await response.json();
      
      data.forEach(row => {
        const cabId = String(row.cabId || "").trim();
        const lat = parseFloat(row.lat);
        const lng = parseFloat(row.lng);
        const speed = parseFloat(row.speed) || 0;

        if (cabId && !isNaN(lat) && !isNaN(lng)) {
          // Display exact speed without multiplying
          const labelText = `${cabId} (${Math.round(speed)} km/h)`;

          if (markers[cabId]) {
            markers[cabId].setLatLng([lat, lng]);
            markers[cabId].setTooltipContent(labelText);
          } else {
            markers[cabId] = L.marker([lat, lng])
              .addTo(map)
              .bindTooltip(labelText, { permanent: true, direction: 'top', offset: [0, -10] });
          }
        }
      });
    } catch (err) {
      console.error("Error fetching fleet data:", err);
    }
  }

  setInterval(fetchFleetData, 5000);
  fetchFleetData();
</script>

</body>
</html>
